[package]
name = "bitcoin-core-rpc"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Async JSON-RPC backend for Bitcoin Core"
repository.workspace = true
readme = "README.md"
keywords = ["bitcoin", "bitcoind", "rpc", "json-rpc", "async"]
categories = ["cryptography::cryptocurrencies", "api-bindings", "asynchronous"]

[dependencies]
bitcoin.workspace = true
bitcoin-node-api.workspace = true
bytes = "1"
corepc-types = "0.16"
futures-core.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt"] }
tracing = { workspace = true, optional = true }

[features]
# Spans and events through `tracing`; never params, results or secrets.
tracing = ["dep:tracing"]

[dev-dependencies]
test-node = { path = "../test-node" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[package.metadata.docs.rs]
all-features = true
