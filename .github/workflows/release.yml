name: Release
# Built on Ubuntu 22.04 (glibc 2.35) so the binaries run on older distros
# and on the Debian 12 distroless image.
# On a version tag: bitcoin-gateway binaries for Linux x86_64 and aarch64 on
# the GitHub release, and a multi-arch image on ghcr.io.
# Anything else is a dry run: the same builds, tarballs and image, each
# binary and the image smoke-tested, nothing published. It runs on a pull
# request that touches the packaging, and by hand (Actions → Release).
on:
    push:
        tags: ["v*"]
    pull_request:
        paths:
            - .github/workflows/release.yml
            - bin/bitcoin-gateway/packaging/**
            - bin/bitcoin-gateway/Dockerfile
    workflow_dispatch:
permissions:
    contents: read
jobs:
    build:
        strategy:
            matrix:
                include:
                    - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu, arch: amd64 }
                    - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, arch: arm64 }
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
              with:
                  key: release-${{ matrix.target }}
            - run: cargo build --release --locked -p bitcoin-gateway --target ${{ matrix.target }}
            - name: Smoke test
              run: target/${{ matrix.target }}/release/bitcoin-gateway --version
            - name: Package
              run: |
                  if [ "$GITHUB_REF_TYPE" = tag ]; then version=$GITHUB_REF_NAME; else version=dry-run-${GITHUB_SHA::7}; fi
                  name=bitcoin-gateway-${version}-${{ matrix.target }}
                  mkdir -p "$name" dist/${{ matrix.arch }}
                  cp target/${{ matrix.target }}/release/bitcoin-gateway "$name/"
                  cp target/${{ matrix.target }}/release/bitcoin-gateway dist/${{ matrix.arch }}/
                  cp LICENSE bin/bitcoin-gateway/README.md bin/bitcoin-gateway/gateway.example.toml \
                     bin/bitcoin-gateway/packaging/bitcoin-gateway.service "$name/"
                  tar -czf "$name.tar.gz" "$name"
                  sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
            - uses: actions/upload-artifact@v4
              with:
                  name: tarball-${{ matrix.arch }}
                  path: bitcoin-gateway-*.tar.gz*
            - uses: actions/upload-artifact@v4
              with:
                  name: dist-${{ matrix.arch }}
                  path: dist/
    release:
        if: startsWith(github.ref, 'refs/tags/v')
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  pattern: tarball-*
                  merge-multiple: true
            - uses: softprops/action-gh-release@v2
              with:
                  files: bitcoin-gateway-*
    image:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4
            - uses: actions/download-artifact@v4
              with:
                  pattern: dist-*
                  merge-multiple: true
                  path: dist
            - run: chmod +x dist/*/bitcoin-gateway
            - uses: docker/setup-qemu-action@v3
            - uses: docker/setup-buildx-action@v3
            - name: Smoke test the image (amd64)
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: bin/bitcoin-gateway/packaging/Dockerfile
                  platforms: linux/amd64
                  load: true
                  tags: bitcoin-gateway:smoke
            - run: docker run --rm bitcoin-gateway:smoke --version
            - uses: docker/login-action@v3
              if: startsWith(github.ref, 'refs/tags/v')
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - uses: docker/metadata-action@v5
              id: meta
              with:
                  images: ghcr.io/${{ github.repository_owner }}/bitcoin-gateway
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
            - uses: docker/build-push-action@v6
              with:
                  context: .
                  file: bin/bitcoin-gateway/packaging/Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: ${{ startsWith(github.ref, 'refs/tags/v') }}
                  tags: ${{ steps.meta.outputs.tags || 'bitcoin-gateway:dry-run' }}
                  labels: ${{ steps.meta.outputs.labels }}
